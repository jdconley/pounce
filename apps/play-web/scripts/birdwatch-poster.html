<!doctype html>
<!-- Birdwatch's poster for Home's shelf (scripts/build-birdwatch-art.mjs renders it at 768 x 512). -->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 768px; height: 512px; overflow: hidden; }
  body {
    position: relative;
    background: radial-gradient(circle at 50% 60%, #7fdcff 0, #2eb8ff 38%, #7b2fff 78%, #4e13c4 100%);
    font-family: "Nunito", ui-rounded, system-ui, sans-serif;
  }
  .rays { position: absolute; inset: -30%; background: repeating-conic-gradient(from 0deg at 50% 58%, rgba(255, 46, 154, 0.55) 0 10deg, transparent 10deg 22deg); }
  .sill { position: absolute; left: 40px; right: 40px; bottom: -60px; height: 130px; border: 6px solid #1b0b3a; border-radius: 34px;
    background: linear-gradient(180deg, #ffb54d, #ff8a00 70%, #c25200); box-shadow: inset 0 -16px 0 rgba(27, 11, 58, 0.25); }
  img.cat { position: absolute; width: 300px; filter: drop-shadow(0 8px 0 rgba(27, 11, 58, 0.45)); }
  .bird { position: absolute; width: 250px; left: 258px; top: 26px; transform: rotate(-8deg); filter: drop-shadow(0 10px 0 rgba(27, 11, 58, 0.5)); }
  .card { position: absolute; width: 112px; height: 157px; border: 5px solid #1b0b3a; border-radius: 14px; box-sizing: border-box; overflow: hidden;
    box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.55), 0 6px 0 rgba(27, 11, 58, 0.55); }
  .card .n { position: absolute; top: 4px; left: 9px; font: 900 48px/1 "Nunito", ui-rounded, sans-serif; color: #fff; -webkit-text-stroke: 9px #1b0b3a; paint-order: stroke fill; letter-spacing: -2px; }
  .card .pip { position: absolute; right: 9px; bottom: 12px; width: 64px; height: 60px; background-size: contain; background-repeat: no-repeat; background-position: right bottom; filter: drop-shadow(0 2px 0 #1b0b3a); }
  .card .seed { position: absolute; top: 6px; right: 7px; padding: 3px 5px; border: 3px solid #1b0b3a; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: linear-gradient(180deg, #fff3c4, #f2c46b); font: 900 19px/1 "Nunito", sans-serif; color: #1b0b3a; }
  .fish { background: linear-gradient(170deg, #4ff2e4, #00d1c1 62%, #00857f); }
  .feather { background: linear-gradient(170deg, #ffb54d, #ff8a00 62%, #c25200); }
  .bell { background: linear-gradient(170deg, #fff08a, #ffd21f 62%, #e09a00); }
  .mouse { background: linear-gradient(170deg, #b78bff, #7b2fff 62%, #4e13c4); }
  .spark { position: absolute; width: 44px; }
</style>
</head>
<body>
  <div class="rays"></div>
  <img class="cat" src="../src/art/cat1-celebrate.webp" style="left: -30px; top: 120px; transform: rotate(-6deg)" />
  <img class="cat" src="../src/art/cat2-awake.webp" style="right: -30px; top: 130px; transform: scaleX(-1) rotate(-6deg)" />
  <img class="bird" src="../src/table/bw-art/bird.svg" />
  <div class="card fish" style="left: 176px; top: 268px; transform: rotate(-16deg)"><span class="n">14</span><span class="seed">10</span><span class="pip" style="background-image: url(../src/art/tile-fish.webp)"></span></div>
  <div class="card feather" style="left: 266px; top: 250px; transform: rotate(-6deg)"><span class="n">5</span><span class="seed">5</span><span class="pip" style="background-image: url(../src/art/tile-feather.webp)"></span></div>
  <div class="card bell" style="left: 362px; top: 248px; transform: rotate(5deg)"><span class="n">10</span><span class="seed">10</span><span class="pip" style="background-image: url(../src/art/tile-bell.webp)"></span></div>
  <div class="card mouse" style="left: 456px; top: 266px; transform: rotate(15deg)"><span class="n">1</span><span class="seed">15</span><span class="pip" style="background-image: url(../src/art/tile-mouse.webp)"></span></div>
  <div class="sill"></div>
  <img class="spark" src="../src/art/fx-sparkle.webp" style="left: 220px; top: 60px" />
  <img class="spark" src="../src/art/fx-sparkle.webp" style="left: 520px; top: 40px; width: 56px" />
  <img class="spark" src="../src/art/fx-star.webp" style="left: 560px; top: 200px; width: 36px" />
</body>
</html>
