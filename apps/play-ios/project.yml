name: Pounce
options:
  bundleIdPrefix: com.conleychaos
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: B222J9J7B8
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TVOS_DEPLOYMENT_TARGET: "26.0"
    # One version for every target: the app, its extensions and the Apple TV app (one App Store
    # record, universal purchase). CI sets the build number on the command line (testflight.sh).
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
packages:
  PounceKit:
    path: PounceKit
targets:
  Pounce:
    type: application
    platform: iOS
    sources:
      - path: Pounce
        excludes:
          - Info.plist
          - Pounce.entitlements
      # Shared with PounceNotify: the Debug -demo-communication notification draws the same way.
      - path: PounceNotify/Communication.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conleychaos.play
        PRODUCT_NAME: Pounce
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Pounce/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pounce/Pounce.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: PounceKit
        product: PounceKit
      # Communication notifications with the sender's cat (spec §12.5), embedded in PlugIns.
      - target: PounceNotify
      # The Us and Streak widgets (spec §11), embedded in PlugIns.
      - target: PounceWidgets
    postBuildScripts:
      # The Debug-only pounce-dev URL scheme must never ship. In Release (or whenever
      # POUNCE_URL_SCHEMES is empty) delete CFBundleURLTypes from the built Info.plist; only
      # "key absent" is tolerated, any other failure fails the build. Then a post-condition:
      # a Release plist that still mentions pounce-dev or CFBundleURLTypes fails the build.
      # Runs before code signing, so the signature covers the stripped plist.
      - name: Strip debug URL scheme
        basedOnDependencyAnalysis: false
        # The built Info.plist as an input, so this runs after it is written: with an embedded
        # extension (PounceNotify) Xcode processes the plist late, after unordered script phases.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          set -eu
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          schemes="$(printf '%s' "${POUNCE_URL_SCHEMES:-}" | tr -d '[:space:]')"
          if [ "${CONFIGURATION}" = "Release" ] || [ -z "$schemes" ]; then
            if /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$plist" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$plist"
            fi
          fi
          if [ "${CONFIGURATION}" = "Release" ] && /usr/bin/plutil -p "$plist" | grep -q -e pounce-dev -e CFBundleURLTypes; then
            echo "error: Release Info.plist still registers a URL scheme (pounce-dev / CFBundleURLTypes): $plist"
            exit 1
          fi
      # Pounce/Resources/PrivacyInfo.xcprivacy (required-reason APIs, collected data) is a
      # resource through the `Pounce` source path. App Store Connect rejects an upload without
      # it, so a build whose bundle lacks it fails here.
      - name: Check privacy manifest
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          manifest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/PrivacyInfo.xcprivacy"
          if [ ! -f "$manifest" ]; then
            echo "error: PrivacyInfo.xcprivacy is missing from the app bundle: $manifest"
            exit 1
          fi
  # The Notification Service Extension (spec §12.5): pushes from a person become communication
  # notifications with their cat as the avatar, read from the containing app's art.
  PounceNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: PounceNotify
        excludes:
          - Info.plist
          - PounceNotify.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conleychaos.play.notify
        PRODUCT_NAME: PounceNotify
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: PounceNotify/Info.plist
        # The App Group: a push's streak block goes to the widgets' snapshot (spec §11.2).
        CODE_SIGN_ENTITLEMENTS: PounceNotify/PounceNotify.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: PounceKit
        product: PounceKit
      - sdk: Intents.framework
  # The widgets (spec §11): the Us widget (small, medium, StandBy) and the Streak widget (the lock
  # screen's three families), the Pounce button and WidgetKit push. Shares the App Group with the
  # app and PounceNotify, and the app's keychain group for the device credential. Draws the app's
  # own art from the containing bundle, plus the app's palette and lettering.
  PounceWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PounceWidgets
        excludes:
          - Info.plist
          - PounceWidgets.entitlements
      - path: Pounce/Design/Palette.swift
      - path: Pounce/Design/OutlinedText.swift
      - path: Pounce/Design/GroupOpacity.swift
      - path: Pounce/Design/ArtName.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conleychaos.play.widgets
        PRODUCT_NAME: PounceWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: PounceWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: PounceWidgets/PounceWidgets.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: PounceKit
        product: PounceKit
  # Pounce on the Apple TV (stage 4 of "Pounce on the TV"): the table as a screen, driven by the
  # phones. The same bundle id as the iPhone app, for universal purchase under one App Store
  # record. No push, Sign in with Apple, App Group or age range: the TV keeps only its device
  # credential, in the app's keychain group.
  PounceTV:
    type: application
    platform: tvOS
    # Its own shell, plus the iPhone's table: one copy of the drawing code, built for both. The
    # SpriteKit table (Pounce/Table, Pounce/Tiles) without the tile game's iPhone screens around it
    # (TilesStage, TilesChrome) or its iPhone demo (TilesDemo); the frame-budget tooling the
    # scenes report to (FrameWork, MainThreadWatchdog, Autoplay); the Design files they use; and the
    # iPhone's art catalog and sounds (its AppIcon set is unused here: the icon is the TV's own).
    # iOS-only calls in the shared files are behind `#if os(iOS)`.
    # When this target starts compiling another folder or file, add it to the Apple TV distribute
    # filter in .github/workflows/ios.yml and to the TV paths in scripts/distribute.swift (and an
    # exclude here to their excludes), or a change there won't reach the family's Apple TVs.
    sources:
      - path: PounceTV
        excludes:
          - Info.plist
          - PounceTV.entitlements
      - path: Pounce/Table
      - path: Pounce/Tiles
        excludes:
          - TilesStage.swift
          - TilesChrome.swift
          - TilesDemo.swift
      # The daily games' watch contract, and everything the TV builds for each game: its watch view
      # and the drawing and art it needs, in `Pounce/Daily/<Game>/TV/`. A game adds files there and
      # touches nothing else (this list, ios.yml's and distribute.swift's TV filters match the same).
      - path: Pounce/Daily
        includes:
          - DailyWatchView.swift
          - DailyWatchGames.swift
          - "*/TV/**"
      - path: Pounce/App/FrameWork.swift
      - path: Pounce/App/MainThreadWatchdog.swift
      - path: Pounce/App/Autoplay.swift
      - path: Pounce/Design/ArtName.swift
      - path: Pounce/Design/FadeGroup.swift
      - path: Pounce/Design/GroupOpacity.swift
      - path: Pounce/Design/Haptics.swift
      - path: Pounce/Design/Juice.swift
      - path: Pounce/Design/NameTag.swift
      - path: Pounce/Design/OutlinedText.swift
      - path: Pounce/Design/Pace.swift
      - path: Pounce/Design/Palette.swift
      - path: Pounce/Design/QRTile.swift
      - path: Pounce/Design/Settings.swift
      - path: Pounce/Design/SignalGlyph.swift
      - path: Pounce/Design/Sound.swift
      - path: Pounce/Resources/Assets.xcassets
      - path: Pounce/Resources/Sounds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conleychaos.play
        PRODUCT_NAME: PounceTV
        TARGETED_DEVICE_FAMILY: "3"
        INFOPLIST_FILE: PounceTV/Info.plist
        CODE_SIGN_ENTITLEMENTS: PounceTV/PounceTV.entitlements
        # PounceTV/Resources/TVAssets.xcassets, made by AppStore/tv-brand.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: PounceKit
        product: PounceKit
    postBuildScripts:
      # PounceTV/Resources/PrivacyInfo.xcprivacy (the TV's own: Device ID, Gameplay Content, Product
      # Interaction and Other Data Types, as docs/privacy/app-store-label.md's Apple TV section
      # says) is a resource through the `PounceTV` source path. App Store Connect rejects an upload without
      # it, so a build whose bundle lacks it fails here.
      - name: Check privacy manifest
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          manifest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/PrivacyInfo.xcprivacy"
          if [ ! -f "$manifest" ]; then
            echo "error: PrivacyInfo.xcprivacy is missing from the app bundle: $manifest"
            exit 1
          fi
  # The Apple TV app's unit tests, hosted in PounceTV on an Apple TV simulator: the TV's table (the
  # iPhone's scenes in the TV's arrangement) and, from stage 4's shell on, the TV's model.
  PounceTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - PounceTVTests
    dependencies:
      - target: PounceTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conleychaos.play.tvtests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "3"
  # The Apple TV's UI tests on an Apple TV simulator, on the TV's DEBUG demos (no server): its
  # frame-rate gates (FrameRateTVTests, the iPhone's FrameRateTests rules, reading the same
  # watchdog) and the Siri Remote driving the shell (RemoteTests).
  PounceTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - PounceTVUITests
      # The watchdog's reading and the machine's time budgets, shared with the iPhone's tests.
      - path: PounceUITests/Watchdog.swift
    dependencies:
      - target: PounceTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conleychaos.play.tvuitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "3"
        TEST_TARGET_NAME: PounceTV
  PounceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PounceUITests
    dependencies:
      - target: Pounce
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conleychaos.play.uitests
        GENERATE_INFOPLIST_FILE: YES
        # Sees every test start, to gate each app's gameplay frames and hangs when it ends.
        INFOPLIST_KEY_NSPrincipalClass: GameplayGate
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: Pounce
schemes:
  Pounce:
    build:
      targets:
        Pounce: all
    run:
      config: Debug
    test:
      config: Debug
      testPlans:
        - path: Pounce.xctestplan
          defaultPlan: true
    profile:
      config: Release
    archive:
      config: Release
  PounceTV:
    build:
      targets:
        PounceTV: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PounceTVTests
        - PounceTVUITests
    profile:
      config: Release
    archive:
      config: Release
