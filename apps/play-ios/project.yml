name: Pounce
options:
  bundleIdPrefix: com.conleychaos
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: B222J9J7B8
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
packages:
  PounceKit:
    path: PounceKit
targets:
  Pounce:
    type: application
    platform: iOS
    sources:
      - path: Pounce
        excludes:
          - Info.plist
          - Pounce.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conleychaos.play
        PRODUCT_NAME: Pounce
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Pounce/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pounce/Pounce.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: PounceKit
        product: PounceKit
    postBuildScripts:
      # The Debug-only pounce-dev URL scheme must never ship. In Release (or whenever
      # POUNCE_URL_SCHEMES is empty) delete CFBundleURLTypes from the built Info.plist; only
      # "key absent" is tolerated, any other failure fails the build. Then a post-condition:
      # a Release plist that still mentions pounce-dev or CFBundleURLTypes fails the build.
      # Runs before code signing, so the signature covers the stripped plist.
      - name: Strip debug URL scheme
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          schemes="$(printf '%s' "${POUNCE_URL_SCHEMES:-}" | tr -d '[:space:]')"
          if [ "${CONFIGURATION}" = "Release" ] || [ -z "$schemes" ]; then
            if /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$plist" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$plist"
            fi
          fi
          if [ "${CONFIGURATION}" = "Release" ] && /usr/bin/plutil -p "$plist" | grep -q -e pounce-dev -e CFBundleURLTypes; then
            echo "error: Release Info.plist still registers a URL scheme (pounce-dev / CFBundleURLTypes): $plist"
            exit 1
          fi
      # Pounce/Resources/PrivacyInfo.xcprivacy (required-reason APIs, collected data) is a
      # resource through the `Pounce` source path. App Store Connect rejects an upload without
      # it, so a build whose bundle lacks it fails here.
      - name: Check privacy manifest
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          manifest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/PrivacyInfo.xcprivacy"
          if [ ! -f "$manifest" ]; then
            echo "error: PrivacyInfo.xcprivacy is missing from the app bundle: $manifest"
            exit 1
          fi
  PounceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PounceUITests
    dependencies:
      - target: Pounce
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conleychaos.play.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Pounce
schemes:
  Pounce:
    build:
      targets:
        Pounce: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PounceUITests
    profile:
      config: Release
    archive:
      config: Release
