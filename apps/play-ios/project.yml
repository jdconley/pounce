name: Pounce
options:
  bundleIdPrefix: com.conleychaos
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: B222J9J7B8
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
packages:
  PounceKit:
    path: PounceKit
targets:
  Pounce:
    type: application
    platform: iOS
    sources:
      - path: Pounce
        excludes:
          - Info.plist
          - Pounce.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conleychaos.play
        PRODUCT_NAME: Pounce
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Pounce/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pounce/Pounce.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: PounceKit
        product: PounceKit
    postBuildScripts:
      # The Debug-only pounce-dev URL scheme must never ship: when POUNCE_URL_SCHEMES is
      # empty (Release), delete the CFBundleURLTypes entry from the built Info.plist.
      # Runs before code signing, so the signature covers the stripped plist.
      - name: Strip debug URL scheme
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "${POUNCE_URL_SCHEMES// /}" ]; then
            /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" 2>/dev/null || true
          fi
  PounceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PounceUITests
    dependencies:
      - target: Pounce
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conleychaos.play.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Pounce
schemes:
  Pounce:
    build:
      targets:
        Pounce: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PounceUITests
    profile:
      config: Release
    archive:
      config: Release
