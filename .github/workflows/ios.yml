name: iOS

on:
  # Every PR builds: `build` is a required check on main, so it has to report on all of them.
  pull_request:
  push:
    branches: [main]
    paths:
      - apps/play-ios/**
      - .github/workflows/ios.yml
  # A push uploads for internal testers only. Running the workflow by hand from main also sends the
  # build to a beta group, so external testers get one build per release, not one per merged PR.
  workflow_dispatch:
    inputs:
      distribute:
        description: Send the build to the TestFlight group below (an external group goes through beta app review)
        type: boolean
        default: true
      group:
        description: TestFlight beta group name
        type: string
        default: Family and Friends
      build:
        description: Distribute this already-uploaded build number instead of archiving a new one (e.g. a build uploaded from a Mac)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/play-ios

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: xcodebuild -version
      - run: swift test --package-path PounceKit
      - run: scripts/bootstrap.sh
      - name: Build Release (unsigned)
        run: >
          xcodebuild build -project Pounce.xcodeproj -scheme Pounce -configuration Release
          -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO -quiet

  testflight:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    # Archive and upload take ~15 min; distributing waits up to 30 more for App Store Connect processing.
    timeout-minutes: 75
    environment: production
    concurrency:
      group: testflight
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check App Store Connect credentials
        id: creds
        working-directory: .
        run: |
          # Until the API key secrets exist the upload is skipped, not failed.
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=TestFlight::ASC_KEY_ID, ASC_ISSUER_ID or ASC_KEY_P8 is unset, so the upload is skipped. See apps/play-ios/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # What to Test lists the commits since the group's previous build
      - name: Archive and upload
        id: upload
        if: steps.creds.outputs.ready == 'true' && inputs.build == ''
        run: |
          BUILD_NUMBER="$(date +%Y%m%d%H%M)"
          export BUILD_NUMBER
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077; printenv ASC_KEY_P8 > "$ASC_KEY_PATH")
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          scripts/testflight.sh
      - name: Distribute to the TestFlight group
        if: steps.creds.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.distribute
        env:
          BUILD: ${{ inputs.build || steps.upload.outputs.build }}
          GROUP: ${{ inputs.group }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077; printenv ASC_KEY_P8 > "$ASC_KEY_PATH")
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          scripts/distribute.swift --build "$BUILD" --group "$GROUP"
