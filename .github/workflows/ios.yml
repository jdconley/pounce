name: iOS

on:
  # Every PR builds: `build` is a required check on main, so it has to report on all of them.
  pull_request:
  push:
    branches: [main]
    paths:
      - apps/play-ios/**
      - .github/workflows/ios.yml
  # A push to main uploads the build and sends it to Family and Friends as well as the internal
  # testers (JD, 2026-11-13: every change goes to the family). Running it by hand picks the group,
  # or redistributes an already-uploaded build.
  workflow_dispatch:
    inputs:
      distribute:
        description: Send the build to the TestFlight group below (an external group goes through beta app review)
        type: boolean
        default: true
      group:
        description: TestFlight beta group name
        type: string
        default: Family and Friends
      build:
        description: Distribute this already-uploaded build number instead of archiving a new one (e.g. a build uploaded from a Mac)
        type: string
        default: ""
      revoke_ci_certs:
        description: Before archiving, revoke every development certificate CI created through the API (for "maximum number of certificates")
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/play-ios

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: xcodebuild -version
      # The main thread draws, nothing else (docs/main-thread.md): no blocking call outside
      # PounceKit's IO layer. The checker checks itself against planted violations first.
      # How busy the runner is, against FrameRateTests' line for trusting a simulator's frame
      # times (a 1-minute load average over half the cores). The UI tests don't run in CI; this
      # says whether they could get trustworthy frame times here.
      - name: Runner load
        working-directory: .
        run: |
          read -r one five fifteen <<<"$(sysctl -n vm.loadavg | tr -d '{}')"
          cores=$(sysctl -n hw.ncpu)
          per=$(echo "$one $cores" | awk '{ printf "%.2f", $1 / $2 }')
          verdict=$(echo "$per" | awk '{ print ($1 > 0.5) ? "over" : "under" }')
          echo "::notice title=Runner load::1-minute load $one on $cores cores: $per per core, $verdict the 0.5 FrameRateTests threshold"
      - name: Main-thread check
        run: |
          swift scripts/main-thread-lint.swift --self-test
          swift scripts/main-thread-lint.swift
      - run: swift test --package-path PounceKit
      - run: scripts/bootstrap.sh
      - name: Build Release (unsigned)
        run: >
          xcodebuild build -project Pounce.xcodeproj -scheme Pounce -configuration Release
          -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO -quiet
      - name: Runner load after building
        if: always()
        working-directory: .
        run: |
          read -r one five fifteen <<<"$(sysctl -n vm.loadavg | tr -d '{}')"
          cores=$(sysctl -n hw.ncpu)
          per=$(echo "$one $cores" | awk '{ printf "%.2f", $1 / $2 }')
          verdict=$(echo "$per" | awk '{ print ($1 > 0.5) ? "over" : "under" }')
          echo "::notice title=Runner load after building::1-minute load $one on $cores cores: $per per core, $verdict the 0.5 FrameRateTests threshold"

  # JD's rule (docs/main-thread.md): the main thread draws, nothing else, 60 fps or better. This
  # runs the runtime gates on a simulator: FrameRateTests (tables that play themselves, nothing
  # reading the screen) and a few Cat Tower and Tuna Tiles UI tests under GameplayGate. All on
  # demo tables, no server. A virtual machine is several times slower per thread than the Mac
  # the budgets were set on, and its host's stolen time counts as the guest's own: the app
  # measures its machine's speed, and the tests scale the app-work budget by it and judge it at
  # p95 with a cap on the worst frame; hangs fail when the app's own work filled them. Frames
  # over 16.7 ms are reported here, enforced on a phone (scripts/frame-rate.sh).
  ui-gates:
    name: Smooth play gates (iOS simulator)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # XcodeGen comes from Homebrew; updating Homebrew first is most of the install's time.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: xcodebuild -version
      - name: Make a simulator
        id: sim
        run: |
          runtime=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')
          udid=$(xcrun simctl create "Pounce gates" "iPhone 17 Pro" "$runtime")
          # It boots while the app builds; the tests wait for it.
          xcrun simctl boot "$udid"
          echo "simulator $udid on $runtime"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - run: scripts/bootstrap.sh
      # Debug (the demos and -autoplay are Debug only) with the compiler's optimizations on, as
      # the shipped app has them (per file rather than whole module, so it builds in parallel).
      - name: Build for testing
        run: >
          xcodebuild build-for-testing -project Pounce.xcodeproj -scheme Pounce -configuration Debug
          -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/dd-gates
          SWIFT_OPTIMIZATION_LEVEL=-O GCC_OPTIMIZATION_LEVEL=s -quiet
      # A fresh simulator's first launches pay one-time costs (caches, shaders) that aren't the
      # app's: one untimed run of a table that plays itself takes them first.
      - name: Warm the simulator
        run: |
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b >/dev/null
          app=$(find build/dd-gates/Build/Products -maxdepth 2 -name Pounce.app -path '*iphonesimulator*' | head -1)
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$app"
          for demo in tiles hit; do
            xcrun simctl launch "${{ steps.sim.outputs.udid }}" com.conleychaos.play -demo "$demo" -anim-speed 1 -autoplay >/dev/null
            sleep 8
            xcrun simctl terminate "${{ steps.sim.outputs.udid }}" com.conleychaos.play || true
          done
      - name: Frame and main-thread gates
        env:
          TEST_RUNNER_POUNCE_FRAMES_SECONDS: "12"
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Pounce.xcodeproj -scheme Pounce \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/dd-gates \
            -collect-test-diagnostics never -resultBundlePath build/ui-gates.xcresult \
            -only-testing:PounceUITests/FrameRateTests \
            -only-testing:PounceUITests/HitTests \
            -only-testing:PounceUITests/TilesTests/testDragPathPlacesAPieceAndDragsItBack \
            -only-testing:PounceUITests/TilesTests/testSeveralPiecesMakeANewSetAndABrokenSetBlocksPlay \
            2>&1 | tee build/ui-gates.log | grep -E '^(FRAMES|Test Case|\s+Executed)|error:'
      - name: Frame summary
        if: always()
        run: |
          {
            echo "### Smooth play gates"
            echo
            echo '```'
            grep -E '^FRAMES ' build/ui-gates.log || echo "no FRAMES lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-gates
          path: |
            apps/play-ios/build/ui-gates.log
            apps/play-ios/build/ui-gates.xcresult
          retention-days: 7

  testflight:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    # Archive and upload take ~15 min; distributing waits up to 30 more for App Store Connect processing.
    timeout-minutes: 75
    environment: production
    concurrency:
      group: testflight
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check App Store Connect credentials
        id: creds
        working-directory: .
        run: |
          # Until the API key secrets exist the upload is skipped, not failed.
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=TestFlight::ASC_KEY_ID, ASC_ISSUER_ID or ASC_KEY_P8 is unset, so the upload is skipped. See apps/play-ios/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # What to Test lists the commits since the group's previous build
      - name: Free the certificate slots CI used up
        if: steps.creds.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.revoke_ci_certs
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077; printenv ASC_KEY_P8 > "$ASC_KEY_PATH")
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          scripts/certs.swift --revoke-api-created
      - name: Archive and upload
        id: upload
        if: steps.creds.outputs.ready == 'true' && inputs.build == ''
        run: |
          BUILD_NUMBER="$(date +%Y%m%d%H%M)"
          export BUILD_NUMBER
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077; printenv ASC_KEY_P8 > "$ASC_KEY_PATH")
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          scripts/testflight.sh
      # The archive minted a development certificate on this throwaway runner. Revoke it, pass or
      # fail, so runs don't pile them up until the team hits Apple's certificate limit.
      - name: Revoke this runner's development certificate
        if: always() && steps.creds.outputs.ready == 'true' && inputs.build == ''
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077; printenv ASC_KEY_P8 > "$ASC_KEY_PATH")
          trap 'rm -f "$ASC_KEY_PATH" "$RUNNER_TEMP"/devcert*.pem' EXIT
          security find-certificate -a -c "Apple Development" -p |
            awk -v dir="$RUNNER_TEMP" '/BEGIN CERTIFICATE/ { n++ } n { print > (dir "/devcert" n ".pem") }'
          serials=()
          for pem in "$RUNNER_TEMP"/devcert*.pem; do
            [ -e "$pem" ] && serials+=("$(openssl x509 -noout -serial -in "$pem" | cut -d= -f2)")
          done
          if [ ${#serials[@]} -eq 0 ]; then echo "no development certificate on this runner"; exit 0; fi
          scripts/certs.swift --revoke "${serials[@]}"
      - name: Distribute to the TestFlight group
        if: steps.creds.outputs.ready == 'true' && (github.event_name == 'push' || inputs.distribute)
        env:
          BUILD: ${{ inputs.build || steps.upload.outputs.build }}
          GROUP: ${{ inputs.group || 'Family and Friends' }}
          # A push lists the app's commits since the previous main; a manual run, since the group's last build.
          FROM: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077; printenv ASC_KEY_P8 > "$ASC_KEY_PATH")
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          if [ -n "$FROM" ] && git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            # A push that doesn't change the app itself (scripts, docs, this workflow) uploads for
            # the internal testers only: the family never gets an identical build.
            if git diff --quiet "$FROM" HEAD -- Pounce PounceKit PounceWidgets PounceNotify project.yml; then
              echo "no app change since $FROM: not sending this build to \"$GROUP\""
              exit 0
            fi
            scripts/distribute.swift --build "$BUILD" --group "$GROUP" --from "$FROM"
          else
            scripts/distribute.swift --build "$BUILD" --group "$GROUP"
          fi
