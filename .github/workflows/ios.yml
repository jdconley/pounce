name: iOS

on:
  # Every PR runs this workflow: `build` is a required check on main, so it has to report on all
  # of them. A PR the app can't feel gets a quick pass instead (see `changes`).
  pull_request:
  push:
    branches: [main]
    paths:
      - apps/play-ios/**
      - .github/workflows/ios.yml
  # A push to main uploads the build and sends it to Family and Friends as well as the internal
  # testers (JD, 2026-11-13: every change goes to the family). Running it by hand picks the group,
  # or redistributes an already-uploaded build.
  workflow_dispatch:
    inputs:
      distribute:
        description: Send the build to the TestFlight group below (an external group goes through beta app review)
        type: boolean
        default: true
      group:
        description: TestFlight beta group name
        type: string
        default: Family and Friends
      build:
        description: Distribute this already-uploaded build number instead of archiving a new one (e.g. a build uploaded from a Mac)
        type: string
        default: ""
      platform:
        description: Which app to archive (or, with a build number, distribute) - both, or just the iPhone (iOS) or Apple TV (tvOS) one
        type: choice
        options: [both, iOS, tvOS]
        default: both
      revoke_ci_certs:
        description: Before archiving, revoke every development certificate CI created through the API (for "maximum number of certificates")
        type: boolean
        default: false
      add_tvos_platform:
        description: One-off, before the first Apple TV upload - only add the tvOS platform to the App Store Connect app record, nothing else (runs on any branch; does nothing once it is there)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/play-ios

jobs:
  # What this PR changes that the iOS and TV apps are built or tested from.
  # - `kit`: apps/play-ios, this workflow, or a server file PounceKit's tests read by path (the
  #   shared fixtures, the funnel's steps, Sniff's word list). Runs the build and unit tests
  #   (PounceKit on macOS, the TV app's on an Apple TV simulator).
  # - `app`: apps/play-ios or this workflow. Also runs the simulator gates, which play demo tables
  #   built from apps/play-ios alone, so no server or web change can move them, and PounceKit's
  #   tvOS run.
  # When neither, the macOS jobs skip and `build` passes on its own in seconds. Server, web and docs
  # PRs used to hold three macOS runners for 20-40 minutes for results they couldn't change, and
  # the queue for those runners held up everything else, the App Store build included. A PounceKit
  # test that starts reading another file outside apps/play-ios adds it to kit_paths. Pushes and
  # dispatches always run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kit: ${{ steps.diff.outputs.kit }}
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2 # the PR's merge commit and the main it merges into
      - id: diff
        working-directory: .
        run: |
          app_paths='^(apps/play-ios/|\.github/workflows/ios\.yml$)'
          kit_paths='^(apps/play-api/fixtures/|apps/play-api/src/funnel/milestones\.ts$|apps/play-api/src/daily/sniff/words/)'
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            app=true kit=true
          else
            files=$(git diff --name-only HEAD^1 HEAD)
            app=false kit=false
            if grep -qE "$app_paths" <<<"$files"; then app=true kit=true
            elif grep -qE "$kit_paths" <<<"$files"; then kit=true
            fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "kit=$kit" >> "$GITHUB_OUTPUT"
          echo "::notice title=iOS::build and unit tests: $kit, simulator gates: $app"

  # The required check. It passes when the build and unit tests passed, or when `changes` says the
  # PR can't affect them.
  build:
    needs: [changes, app-build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - working-directory: .
        env:
          CHANGES: ${{ needs.changes.result }}
          KIT: ${{ needs.changes.outputs.kit }}
          BUILD: ${{ needs.app-build.result }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "::error::couldn't tell whether the app changed (changes: $CHANGES)"
            exit 1
          elif [ "$KIT" = true ]; then
            if [ "$BUILD" != success ]; then
              echo "::error::Build and unit tests: $BUILD"
              exit 1
            fi
            echo "Build and unit tests passed"
          else
            echo "::notice title=iOS::nothing the app builds from changed; build and gates skipped"
          fi

  app-build:
    name: Build and unit tests
    needs: changes
    if: needs.changes.outputs.kit == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: xcodebuild -version
      # The main thread draws, nothing else (docs/main-thread.md): no blocking call outside
      # PounceKit's IO layer. The checker checks itself against planted violations first.
      # How busy the runner is, against FrameRateTests' line for trusting a simulator's frame
      # times (a 1-minute load average over half the cores). The UI tests don't run in CI; this
      # says whether they could get trustworthy frame times here.
      - name: Runner load
        working-directory: .
        run: |
          read -r one five fifteen <<<"$(sysctl -n vm.loadavg | tr -d '{}')"
          cores=$(sysctl -n hw.ncpu)
          per=$(echo "$one $cores" | awk '{ printf "%.2f", $1 / $2 }')
          verdict=$(echo "$per" | awk '{ print ($1 > 0.5) ? "over" : "under" }')
          echo "::notice title=Runner load::1-minute load $one on $cores cores: $per per core, $verdict the 0.5 FrameRateTests threshold"
      - name: Main-thread check
        run: |
          swift scripts/main-thread-lint.swift --self-test
          swift scripts/main-thread-lint.swift
      - run: swift test --package-path PounceKit
      - run: scripts/bootstrap.sh
      - name: Build Release (unsigned)
        run: >
          xcodebuild build -project Pounce.xcodeproj -scheme Pounce -configuration Release
          -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO -quiet
      - name: Build Apple TV Release (unsigned)
        # The build, plus the tvOS SDK's download on an image without it.
        timeout-minutes: 15
        run: |
          # Since Xcode 15 the tvOS SDK is an optional component; fetch it if the image lacks it.
          xcodebuild -showsdks | grep appletvos >/dev/null || xcodebuild -downloadPlatform tvOS
          xcodebuild build -project Pounce.xcodeproj -scheme PounceTV -configuration Release \
            -destination generic/platform=tvOS CODE_SIGNING_ALLOWED=NO -quiet
      # The TV app's unit tests on an Apple TV simulator (PounceTVTests: its table never drawing a
      # hand, its model and its races). Each TV step is capped, so a stuck simulator can't hold up
      # this required job; the TV's frame and remote gates are their own job below.
      - name: Make an Apple TV simulator
        id: tvsim
        timeout-minutes: 12
        run: |
          # The runtime for this Xcode's tvOS SDK (major.minor), not just the newest installed.
          xcodebuild -showsdks | grep appletvsimulator >/dev/null || xcodebuild -downloadPlatform tvOS
          sdk=$(xcrun --sdk appletvsimulator --show-sdk-platform-version | cut -d. -f1-2)
          tvos_runtime() {
            xcrun simctl list runtimes -j | jq -r --arg v "$sdk" '[.runtimes[] | select(.platform == "tvOS" and .isAvailable and ((.version | split(".") | .[0:2] | join(".")) == $v))] | last | .identifier // empty'
          }
          runtime=$(tvos_runtime)
          if [ -z "$runtime" ]; then
            xcodebuild -downloadPlatform tvOS
            runtime=$(tvos_runtime)
          fi
          [ -n "$runtime" ] || { echo "::error::no tvOS $sdk simulator runtime"; exit 1; }
          udid=$(xcrun simctl create "Pounce TV tests" com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-1080p "$runtime")
          xcrun simctl boot "$udid"
          echo "Apple TV simulator $udid on $runtime (SDK $sdk)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Apple TV unit tests
        timeout-minutes: 12
        run: >
          xcodebuild test -project Pounce.xcodeproj -scheme PounceTV -configuration Debug
          -destination "id=${{ steps.tvsim.outputs.udid }}" -derivedDataPath build/dd-tv-tests
          -only-testing:PounceTVTests -quiet
      - name: Runner load after building
        if: always()
        working-directory: .
        run: |
          read -r one five fifteen <<<"$(sysctl -n vm.loadavg | tr -d '{}')"
          cores=$(sysctl -n hw.ncpu)
          per=$(echo "$one $cores" | awk '{ printf "%.2f", $1 / $2 }')
          verdict=$(echo "$per" | awk '{ print ($1 > 0.5) ? "over" : "under" }')
          echo "::notice title=Runner load after building::1-minute load $one on $cores cores: $per per core, $verdict the 0.5 FrameRateTests threshold"

  # JD's rule (docs/main-thread.md): the main thread draws, nothing else, 60 fps or better. This
  # runs the runtime gates on a simulator: FrameRateTests (tables that play themselves, nothing
  # reading the screen) and a few Cat Tower and Tuna Tiles UI tests under GameplayGate. All on
  # demo tables, no server. A virtual machine is several times slower per thread than the Mac
  # the budgets were set on, and its host's stolen time counts as the guest's own: the app
  # measures its machine's speed, and the tests scale the app-work budget by it and judge it at
  # p95 with a cap on the worst frame; hangs fail when the app's own work filled them. Frames
  # over 16.7 ms are reported here, enforced on a phone (scripts/frame-rate.sh).
  ui-gates:
    name: Smooth play gates (iOS simulator)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    # A passing run takes 22-26 minutes, and a busy runner's build alone can take 16: at 30 one
    # was cancelled mid-gates (#185). A stuck simulator still can't hold the runner for long.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # TEMP (diagnosing runner load): CPU use and the busiest processes every few seconds.
      - name: Sample the runner
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/load"
          echo "cores $(sysctl -n hw.ncpu), memory $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          mdutil -as 2>&1 | head -6 || true
          xcrun simctl list devices booted
          nohup bash -c 'while true; do echo "=== $(date -u +%H:%M:%S) loadavg $(sysctl -n vm.loadavg)"; top -l 2 -s 2 -n 12 -o cpu -stats pid,command,cpu,th,state | awk "/^Processes:/{n++} n==2"; sleep 6; done' > "$RUNNER_TEMP/load/samples.log" 2>&1 &
      # Spotlight indexes the checkout, the build and the simulator's files as they are written.
      - name: Spotlight off
        working-directory: .
        run: sudo mdutil -a -i off
      - run: xcodebuild -version
      # XcodeGen from its pinned, checksummed release: seconds, where Homebrew takes over three
      # minutes. scripts/bootstrap.sh finds it on the path.
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Make a simulator
        id: sim
        run: |
          runtime=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')
          udid=$(xcrun simctl create "Pounce gates" "iPhone 17 Pro" "$runtime")
          # It boots while the app builds; the tests wait for it.
          xcrun simctl boot "$udid"
          echo "simulator $udid on $runtime"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - run: scripts/bootstrap.sh
      # Debug (the demos and -autoplay are Debug only) with the compiler's optimizations on, as
      # the shipped app has them (per file rather than whole module, so it builds in parallel).
      - name: Build for testing
        run: >
          xcodebuild build-for-testing -project Pounce.xcodeproj -scheme Pounce -configuration Debug
          -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/dd-gates
          SWIFT_OPTIMIZATION_LEVEL=-O GCC_OPTIMIZATION_LEVEL=s -quiet
      # A fresh simulator's first launches pay one-time costs (caches, shaders) that aren't the
      # app's: one untimed run of a table that plays itself takes them first.
      - name: Warm the simulator
        run: |
          # Free the build's memory: the build service stays resident after the build.
          killall SWBBuildService XCBBuildService 2>/dev/null || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b >/dev/null
          # The simulator's own system logging at its default level, not debug.
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log config --mode "level:default" || true
          app=$(find build/dd-gates/Build/Products -maxdepth 2 -name Pounce.app -path '*iphonesimulator*' | head -1)
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$app"
          for demo in tiles hit; do
            xcrun simctl launch "${{ steps.sim.outputs.udid }}" com.conleychaos.play -demo "$demo" -anim-speed 1 -autoplay >/dev/null
            sleep 8
            xcrun simctl terminate "${{ steps.sim.outputs.udid }}" com.conleychaos.play || true
          done
      # TEMP (diagnosing runner load)
      - name: Memory before the gates
        working-directory: .
        run: top -l 1 -n 15 -o mem -stats pid,command,mem,cpu | sed -n '1,40p'
      - name: Frame and main-thread gates
        env:
          TEST_RUNNER_POUNCE_FRAMES_SECONDS: "12"
          # Waits only (a runner's first launch can take over 20 s to show a table); the time
          # budgets fit the machine on their own.
          TEST_RUNNER_POUNCE_UITEST_TIMEOUT_SCALE: "3"
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Pounce.xcodeproj -scheme Pounce \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/dd-gates \
            -collect-test-diagnostics never -resultBundlePath build/ui-gates.xcresult \
            -only-testing:PounceUITests/FrameRateTests \
            -only-testing:PounceUITests/HitTests \
            -only-testing:PounceUITests/ToyTumbleTests \
            -only-testing:PounceUITests/TilesTests/testDragPathPlacesAPieceAndDragsItBack \
            -only-testing:PounceUITests/TilesTests/testSeveralPiecesMakeANewSetAndABrokenSetBlocksPlay \
            -only-testing:PounceUITests/DailyFrameTests/testTheDishBoardHoldsTheFrameRate \
            -only-testing:PounceUITests/DailyTests/testTheDishScreen \
            -only-testing:PounceUITests/DailyTests/testTheDishHidesWhenOff \
            2>&1 | tee build/ui-gates.log | grep -E '^(FRAMES|Test Case|\s+Executed)|error:'
      - name: Frame summary
        if: always()
        run: |
          {
            echo "### Smooth play gates"
            echo
            echo '```'
            grep -E '^FRAMES ' build/ui-gates.log || echo "no FRAMES lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # TEMP (diagnosing runner load)
      - name: Runner samples
        if: always()
        working-directory: .
        run: |
          xcrun simctl list devices booted
          echo "--- per sample: time, load average, CPU use"
          awk '/^=== /{t=$2; l=$4} /^CPU usage/{print t, "load", l, $0}' "$RUNNER_TEMP/load/samples.log"
          echo "--- every sample"
          cat "$RUNNER_TEMP/load/samples.log"
      - name: Keep the results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-gates
          path: |
            apps/play-ios/build/ui-gates.log
            apps/play-ios/build/ui-gates.xcresult
          retention-days: 7

  # The same gates on the Apple TV, after PounceKit's tests on tvOS: FrameRateTVTests (the
  # iPhone's FrameRateTests rules, read from the same watchdog: a six-seat Cat Tower, a four-seat Tuna Tiles and the shell's table, each
  # playing itself on a fake socket) and RemoteTests (the Siri Remote driving home, the lobby, the
  # menu and the table, with something focused after every press). All on DEBUG demos, no server,
  # in an optimized Debug build on a fresh Apple TV simulator, judged as the iOS job judges its
  # runner. Not a required check.
  tv-gates:
    name: TV smooth play gates (Apple TV simulator)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: xcodebuild -version
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Make an Apple TV simulator
        id: sim
        run: |
          # The runtime for this Xcode's tvOS SDK (major.minor), not just the newest installed.
          xcodebuild -showsdks | grep appletvsimulator >/dev/null || xcodebuild -downloadPlatform tvOS
          sdk=$(xcrun --sdk appletvsimulator --show-sdk-platform-version | cut -d. -f1-2)
          tvos_runtime() {
            xcrun simctl list runtimes -j | jq -r --arg v "$sdk" '[.runtimes[] | select(.platform == "tvOS" and .isAvailable and ((.version | split(".") | .[0:2] | join(".")) == $v))] | last | .identifier // empty'
          }
          runtime=$(tvos_runtime)
          if [ -z "$runtime" ]; then
            xcodebuild -downloadPlatform tvOS
            runtime=$(tvos_runtime)
          fi
          [ -n "$runtime" ] || { echo "::error::no tvOS $sdk simulator runtime"; exit 1; }
          udid=$(xcrun simctl create "Pounce TV gates" com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-1080p "$runtime")
          # It boots while the app builds; the tests wait for it.
          xcrun simctl boot "$udid"
          echo "simulator $udid on $runtime"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # PounceKit built for tvOS and its tests (its logic is also `swift test` in the build job).
      # Its log is kept (and the failures shown) so a failing test names itself.
      - name: PounceKit tests on tvOS
        timeout-minutes: 12
        working-directory: apps/play-ios/PounceKit
        run: |
          set -o pipefail
          mkdir -p ../build
          xcodebuild test -scheme PounceKit-Package -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath ../build/dd-kit-tv > ../build/tv-kit.log 2>&1 \
            || { grep -E '✘|error:|recorded an issue' ../build/tv-kit.log | head -60; exit 1; }
          grep -E 'Test run with' ../build/tv-kit.log || true
      - run: scripts/bootstrap.sh
      # Debug (the demos are Debug only) with the compiler's optimizations on, as the shipped app
      # has them.
      - name: Build for testing
        run: >
          xcodebuild build-for-testing -project Pounce.xcodeproj -scheme PounceTV -configuration Debug
          -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/dd-tv-gates
          SWIFT_OPTIMIZATION_LEVEL=-O GCC_OPTIMIZATION_LEVEL=s -quiet
      # A fresh simulator's first launches pay one-time costs (caches, shaders) that aren't the
      # app's: one untimed run of each table that plays itself takes them first.
      - name: Warm the simulator
        run: |
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b >/dev/null
          app=$(find build/dd-tv-gates/Build/Products -maxdepth 2 -name PounceTV.app -path '*appletvsimulator*' | head -1)
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$app"
          for demo in tv-tiles tv-hit; do
            xcrun simctl launch "${{ steps.sim.outputs.udid }}" com.conleychaos.play -demo "$demo" -anim-speed 1 >/dev/null
            sleep 8
            xcrun simctl terminate "${{ steps.sim.outputs.udid }}" com.conleychaos.play || true
          done
      - name: Frame, main-thread and remote gates
        env:
          TEST_RUNNER_POUNCE_FRAMES_SECONDS: "12"
          # Waits only; the time budgets fit the machine on their own.
          TEST_RUNNER_POUNCE_UITEST_TIMEOUT_SCALE: "3"
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Pounce.xcodeproj -scheme PounceTV \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/dd-tv-gates \
            -collect-test-diagnostics never -resultBundlePath build/tv-gates.xcresult \
            -only-testing:PounceTVUITests/FrameRateTVTests \
            -only-testing:PounceTVUITests/RemoteTests \
            2>&1 | tee build/tv-gates.log | grep -E '^(FRAMES|Test Case|\s+Executed)|error:'
      - name: Frame summary
        if: always()
        run: |
          {
            echo "### TV smooth play gates"
            echo
            echo '```'
            grep -E '^FRAMES ' build/tv-gates.log || echo "no FRAMES lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tv-gates
          path: |
            apps/play-ios/build/tv-kit.log
            apps/play-ios/build/tv-gates.log
            apps/play-ios/build/tv-gates.xcresult
          retention-days: 7

  # One-off (JD OK'd it, 2026-11-16): add the tvOS platform to the App Store Connect app record, the
  # only App Store Connect change this makes. Runs only when asked (add_tvos_platform), on any
  # branch, so it can go before the first merge that uploads an Apple TV build; that dispatch does
  # nothing else (testflight skips it), and a second run changes nothing. The version string is
  # project.yml's MARKETING_VERSION.
  tv-platform:
    name: Add the Apple TV platform
    if: github.event_name == 'workflow_dispatch' && inputs.add_tvos_platform
    runs-on: xcode-27
    timeout-minutes: 10
    environment: production
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Add the tvOS platform to the app record
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error title=App Store Connect::ASC_KEY_ID, ASC_ISSUER_ID or ASC_KEY_P8 is unset. See apps/play-ios/README.md."
            exit 1
          fi
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9.]*\)"\{0,1\} *$/\1/p' project.yml | head -1)
          [ -n "$version" ] || { echo "::error::no MARKETING_VERSION in project.yml"; exit 1; }
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077; printenv ASC_KEY_P8 > "$ASC_KEY_PATH")
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          scripts/asc-add-platform.swift --version "$version"

  # Uploads the iPhone and the Apple TV builds (one build number for both: App Store Connect keeps a
  # build train per platform) and sends each to the group when its own app changed.
  testflight:
    needs: build
    # A dispatch with add_tvos_platform makes only that change (tv-platform), no upload.
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && !inputs.add_tvos_platform
    runs-on: xcode-27
    # Each archive and upload takes ~10-15 min; each distribute waits up to 30 more for App Store
    # Connect processing (the Apple TV build mostly processes while the iPhone one is waited on).
    timeout-minutes: 100
    environment: production
    permissions:
      contents: read
      actions: read # main's earlier runs, for where this build's changes start
    concurrency:
      group: testflight
      cancel-in-progress: false
    env:
      # Archives use Xcode 27 (the iOS 27 and tvOS 27 SDKs): App Store Connect warns on uploads
      # built with an older SDK (ITMS-90725, ITMS-90994) and requires 27 from April 2027.
      # xcode-27 is GitHub's image with it (still a preview, so the test jobs stay on macos-26).
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check App Store Connect credentials
        id: creds
        working-directory: .
        run: |
          # Until the API key secrets exist the upload is skipped, not failed.
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=TestFlight::ASC_KEY_ID, ASC_ISSUER_ID or ASC_KEY_P8 is unset, so the upload is skipped. See apps/play-ios/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # What to Test lists the commits since the group's previous build
      # Where this build's changes start: main's last iOS push run that went all the way through, not
      # the push just before this one. A run still waiting for its runner is dropped when a newer
      # push lands (the workflow's concurrency group), so its commits ride in this build instead;
      # measured from `github.event.before` they'd be missing from What to Test, and a push with no
      # app change of its own would keep their build from the family altogether.
      - name: Commits since main's last good build
        id: since
        if: steps.creds.outputs.ready == 'true' && github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          from=""
          for sha in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow ios.yml --branch main --event push \
              --status success --limit 20 --json headSha --jq '.[].headSha'); do
            if [ "$sha" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then
              from=$sha
              break
            fi
          done
          from=${from:-$BEFORE}
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "::notice title=TestFlight::this build's changes start after $from"
      - name: Free the certificate slots CI used up
        if: steps.creds.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.revoke_ci_certs
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077; printenv ASC_KEY_P8 > "$ASC_KEY_PATH")
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          scripts/certs.swift --revoke-api-created
      - name: Archive and upload
        id: upload
        if: steps.creds.outputs.ready == 'true' && inputs.build == '' && inputs.platform != 'tvOS'
        run: |
          BUILD_NUMBER="$(date +%Y%m%d%H%M)"
          export BUILD_NUMBER
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077; printenv ASC_KEY_P8 > "$ASC_KEY_PATH")
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          scripts/testflight.sh
      # The Apple TV app, with the iPhone's build number (its own, on a tvOS-only dispatch). It is
      # signed for the App Store at export, with no device (scripts/testflight.sh). If it fails or
      # stalls (the 30-minute cap covers the archive and any tvOS SDK download), the iPhone build
      # is still distributed and the last step fails the job.
      - name: Archive and upload (Apple TV)
        id: upload-tv
        if: steps.creds.outputs.ready == 'true' && inputs.build == '' && inputs.platform != 'iOS'
        continue-on-error: true
        timeout-minutes: 30
        env:
          BUILD_NUMBER: ${{ steps.upload.outputs.build }}
          PLATFORM: tvOS
        run: |
          BUILD_NUMBER="${BUILD_NUMBER:-$(date +%Y%m%d%H%M)}"
          export BUILD_NUMBER
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          xcodebuild -showsdks | grep appletvos >/dev/null || xcodebuild -downloadPlatform tvOS
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077; printenv ASC_KEY_P8 > "$ASC_KEY_PATH")
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          scripts/testflight.sh
      # The archives minted a development certificate on this throwaway runner. Revoke it, pass or
      # fail, so runs don't pile them up until the team hits Apple's certificate limit.
      - name: Revoke this runner's development certificate
        if: always() && steps.creds.outputs.ready == 'true' && inputs.build == ''
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077; printenv ASC_KEY_P8 > "$ASC_KEY_PATH")
          trap 'rm -f "$ASC_KEY_PATH" "$RUNNER_TEMP"/devcert*.pem' EXIT
          security find-certificate -a -c "Apple Development" -p |
            awk -v dir="$RUNNER_TEMP" '/BEGIN CERTIFICATE/ { n++ } n { print > (dir "/devcert" n ".pem") }'
          serials=()
          for pem in "$RUNNER_TEMP"/devcert*.pem; do
            [ -e "$pem" ] && serials+=("$(openssl x509 -noout -serial -in "$pem" | cut -d= -f2)")
          done
          if [ ${#serials[@]} -eq 0 ]; then echo "no development certificate on this runner"; exit 0; fi
          scripts/certs.swift --revoke "${serials[@]}"
      - name: Distribute to the TestFlight group
        if: >-
          steps.creds.outputs.ready == 'true' && (github.event_name == 'push' || inputs.distribute)
          && inputs.platform != 'tvOS'
        env:
          BUILD: ${{ inputs.build || steps.upload.outputs.build }}
          GROUP: ${{ inputs.group || 'Family and Friends' }}
          # A push lists the app's commits since main's last good build; a manual run, since the group's last build.
          FROM: ${{ steps.since.outputs.from }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077; printenv ASC_KEY_P8 > "$ASC_KEY_PATH")
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          if [ -n "$FROM" ] && git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            # A push that doesn't change the app itself (scripts, docs, this workflow) uploads for
            # the internal testers only: the family never gets an identical build.
            if git diff --quiet "$FROM" HEAD -- Pounce PounceKit PounceWidgets PounceNotify Config project.yml; then
              echo "no app change since $FROM: not sending this build to \"$GROUP\""
              exit 0
            fi
            scripts/distribute.swift --build "$BUILD" --group "$GROUP" --from "$FROM"
          else
            scripts/distribute.swift --build "$BUILD" --group "$GROUP"
          fi
      # The Apple TV build, when this run uploaded one. Its paths are what PounceTV compiles
      # (project.yml's PounceTV sources: its own folder, the shared table code and art, PounceKit,
      # the build configs), less the iPhone-only files those folders hold; keep them in step with
      # project.yml and distribute.swift.
      # Also a dispatch with platform tvOS and a build number: that Apple TV build, uploaded before.
      - name: Distribute the Apple TV build to the TestFlight group
        if: >-
          !cancelled() && steps.creds.outputs.ready == 'true'
          && (steps.upload-tv.outcome == 'success' || (inputs.build != '' && inputs.platform == 'tvOS'))
          && (github.event_name == 'push' || inputs.distribute)
        env:
          BUILD: ${{ inputs.build || steps.upload-tv.outputs.build }}
          GROUP: ${{ inputs.group || 'Family and Friends' }}
          FROM: ${{ steps.since.outputs.from }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077; printenv ASC_KEY_P8 > "$ASC_KEY_PATH")
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          tv=(PounceTV PounceKit Config project.yml
            Pounce/Table Pounce/Tiles Pounce/Birdwatch Pounce/Tumble Pounce/Purrtrait/PurrEaselView.swift Pounce/Purrtrait/PurrWords.swift
            ':!Pounce/Tiles/TilesStage.swift' ':!Pounce/Tiles/TilesChrome.swift' ':!Pounce/Tiles/TilesDemo.swift'
            ':!Pounce/Birdwatch/BirdStage.swift' ':!Pounce/Birdwatch/BirdPanels.swift' ':!Pounce/Birdwatch/BirdScoreSheet.swift' ':!Pounce/Birdwatch/BirdDemo.swift'
            ':!Pounce/Tumble/TumbleStage.swift' ':!Pounce/Tumble/TumbleDemo.swift'
            Pounce/App/FrameWork.swift Pounce/App/MainThreadWatchdog.swift Pounce/App/Autoplay.swift
            Pounce/Design/ArtName.swift Pounce/Design/FadeGroup.swift Pounce/Design/GroupOpacity.swift Pounce/Design/Haptics.swift
            Pounce/Design/Juice.swift Pounce/Design/NameTag.swift Pounce/Design/OutlinedText.swift Pounce/Design/Pace.swift
            Pounce/Design/Palette.swift Pounce/Design/QRTile.swift Pounce/Design/Settings.swift Pounce/Design/SignalGlyph.swift
            Pounce/Design/Sound.swift
            Pounce/Daily/DailyWatchView.swift Pounce/Daily/DailyWatchGames.swift ':(glob)Pounce/Daily/*/TV/**'
            Pounce/Resources/Assets.xcassets Pounce/Resources/Sounds)
          if [ -n "$FROM" ] && git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            if git diff --quiet "$FROM" HEAD -- "${tv[@]}"; then
              echo "no Apple TV app change since $FROM: not sending this build to \"$GROUP\""
              exit 0
            fi
            scripts/distribute.swift --platform TV_OS --build "$BUILD" --group "$GROUP" --from "$FROM"
          else
            scripts/distribute.swift --platform TV_OS --build "$BUILD" --group "$GROUP"
          fi
      - name: Apple TV upload failed
        if: ${{ !cancelled() && steps.upload-tv.outcome == 'failure' }}
        working-directory: .
        run: |
          echo "::error title=TestFlight::The Apple TV archive or upload failed (the iPhone build went ahead). See \"Archive and upload (Apple TV)\"."
          exit 1
